<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minhas Compras</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --sage: #2C7A8C;
            --sage-dark: #1B5464;
            --sage-light: #A9D6E0;
            --cream: #F2F8FA;
            --charcoal: #16323B;
            --terracotta: #5BA3B8;
            --gold: #7FC5D6;
            --paper: #FFFFFF;
            --line: #DCEAEF;
            --muted: #7A8E94;
            --danger: #C15B4E;
            --success: #3E9B8E;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--cream);
            min-height: 100vh;
            color: var(--charcoal);
            padding-bottom: 40px;
        }

        .app-header {
            background: linear-gradient(160deg, var(--sage-dark) 0%, var(--sage) 100%);
            padding: 28px 20px 22px;
            position: relative;
            overflow: hidden;
        }

        .app-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 20px;
            background: var(--cream);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }

        .app-title {
            font-size: 30px;
            font-weight: normal;
            letter-spacing: 0.5px;
            color: var(--cream);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .app-subtitle {
            text-align: center;
            color: var(--sage-light);
            font-size: 13px;
            font-style: italic;
            margin-top: 4px;
            font-family: 'Georgia', serif;
        }

        .sync-status {
            position: absolute;
            top: 14px;
            right: 16px;
            font-size: 10px;
            color: var(--sage-light);
            font-family: -apple-system, sans-serif;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sync-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--sage-light);
        }

        .sync-status.syncing .sync-dot {
            background: var(--gold);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: var(--cream);
            padding: 0 12px;
            gap: 6px;
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid var(--line);
        }

        .tab {
            flex: 1;
            background: none;
            border: none;
            padding: 14px 6px 12px;
            font-family: -apple-system, sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.25s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .tab-icon { font-size: 18px; }

        .tab.active {
            color: var(--sage-dark);
            border-bottom-color: var(--sage);
        }

        .content {
            padding: 20px 16px;
            max-width: 640px;
            margin: 0 auto;
        }

        .section-view { display: none; }
        .section-view.active { display: block; animation: fadeIn 0.3s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Add card */
        .add-card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(46,58,52,0.04);
        }

        .add-card h3 {
            font-size: 17px;
            font-weight: normal;
            color: var(--sage-dark);
            margin-bottom: 14px;
            font-family: 'Georgia', serif;
        }

        .field { margin-bottom: 12px; }

        .field label {
            display: block;
            font-family: -apple-system, sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--line);
            border-radius: 10px;
            font-size: 16px;
            font-family: -apple-system, sans-serif;
            color: var(--charcoal);
            background: var(--cream);
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--sage);
        }

        .field-row {
            display: flex;
            gap: 10px;
        }

        .field-row .field { flex: 1; }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-family: -apple-system, sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--sage);
            color: white;
        }

        .btn-primary:active { background: var(--sage-dark); transform: scale(0.98); }

        .btn-success {
            background: var(--success);
            color: white;
            margin-top: 8px;
        }

        /* Photo upload */
        .photo-upload {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--cream);
            border: 1.5px dashed var(--sage-light);
            border-radius: 10px;
            cursor: pointer;
            font-family: -apple-system, sans-serif;
            font-size: 13px;
            color: var(--muted);
        }

        .photo-upload-preview {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--line);
        }

        .photo-upload-icon {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: var(--sage-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        /* Search + filter bar */
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 160px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 0 12px;
        }

        .search-box input {
            border: none;
            background: none;
            padding: 11px 0;
        }

        .search-box input:focus { border: none; }

        .filter-select {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 10px;
            font-family: -apple-system, sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--sage-dark);
            max-width: 150px;
            padding: 11px 12px;
        }

        /* Totals banner */
        .totals {
            background: linear-gradient(135deg, var(--charcoal) 0%, var(--sage-dark) 100%);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 18px;
            color: var(--cream);
        }

        .totals-main {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
        }

        .totals-main-label {
            font-family: -apple-system, sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--sage-light);
        }

        .totals-main-value {
            font-size: 30px;
            font-family: 'Georgia', serif;
        }

        .totals-by-store {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.15);
        }

        .store-total {
            font-family: -apple-system, sans-serif;
            font-size: 12px;
            background: rgba(255,255,255,0.12);
            padding: 5px 10px;
            border-radius: 20px;
        }

        .store-total span { color: var(--gold); font-weight: 600; }

        /* Item cards */
        .item-list { list-style: none; }

        .item {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            gap: 14px;
            align-items: flex-start;
            box-shadow: 0 2px 10px rgba(46,58,52,0.04);
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            position: relative;
        }

        .item.dragging {
            opacity: 0.5;
            box-shadow: 0 8px 24px rgba(46,58,52,0.18);
            transform: scale(1.02);
        }

        .item.drag-over {
            border-color: var(--sage);
            border-style: dashed;
        }

        .item.picked {
            background: #F1F5F1;
            border-color: var(--success);
        }

        .item.picked .item-name { text-decoration: line-through; color: var(--muted); }

        .drag-handle {
            cursor: grab;
            color: var(--sage-light);
            font-size: 20px;
            padding: 4px 2px;
            touch-action: none;
            align-self: center;
            user-select: none;
        }

        .item-photo {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            background: var(--cream);
            flex-shrink: 0;
        }

        .item-photo-empty {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            background: var(--cream);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            color: var(--sage-light);
        }

        .item-body { flex: 1; min-width: 0; }

        .item-name {
            font-size: 17px;
            font-family: 'Georgia', serif;
            color: var(--charcoal);
            margin-bottom: 2px;
        }

        .item-brand {
            font-family: -apple-system, sans-serif;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .item-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin-bottom: 8px;
        }

        .store-tag {
            font-family: -apple-system, sans-serif;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 20px;
            background: var(--sage-light);
            color: var(--sage-dark);
        }

        .item-price-line {
            font-family: -apple-system, sans-serif;
            font-size: 13px;
            color: var(--muted);
        }

        .item-subtotal {
            font-family: 'Georgia', serif;
            font-size: 18px;
            color: var(--sage-dark);
            font-weight: bold;
        }

        .item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 2px;
            background: var(--cream);
            border-radius: 8px;
            padding: 2px;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border: none;
            background: var(--paper);
            border-radius: 6px;
            font-size: 18px;
            color: var(--sage-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:active { background: var(--sage-light); }

        .qty-value {
            min-width: 32px;
            text-align: center;
            font-family: -apple-system, sans-serif;
            font-weight: 600;
            font-size: 15px;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
        }

        .icon-btn:active { transform: scale(0.9); }
        .btn-check { background: var(--success); color: white; }
        .btn-uncheck { background: var(--gold); color: white; }
        .btn-edit { background: var(--cream); color: var(--sage-dark); }
        .btn-trash { background: #F5E4E1; color: var(--danger); }

        /* Empty state */
        .empty {
            text-align: center;
            padding: 50px 20px;
            color: var(--muted);
        }

        .empty-icon { font-size: 44px; margin-bottom: 12px; opacity: 0.5; }
        .empty p { font-family: -apple-system, sans-serif; font-size: 14px; }
        .empty p.sub { font-size: 12px; margin-top: 6px; opacity: 0.7; }

        /* Compare prices */
        .compare-product {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            margin-bottom: 14px;
            overflow: hidden;
        }

        .compare-header {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: var(--paper);
        }

        .compare-name {
            font-family: 'Georgia', serif;
            font-size: 17px;
            color: var(--charcoal);
        }

        .compare-cheapest {
            font-family: -apple-system, sans-serif;
            font-size: 12px;
            color: var(--success);
            font-weight: 600;
            margin-top: 2px;
        }

        .compare-prices {
            padding: 0 16px 14px;
            border-top: 1px solid var(--line);
        }

        .price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid var(--cream);
            font-family: -apple-system, sans-serif;
            font-size: 14px;
        }

        .price-row:last-child { border-bottom: none; }

        .price-row.best .price-store { color: var(--success); font-weight: 700; }
        .price-row.best .price-value { color: var(--success); font-weight: 700; }

        .price-store { color: var(--charcoal); display: flex; align-items: center; gap: 6px; }
        .price-value { font-weight: 600; color: var(--sage-dark); }
        .price-best-badge {
            font-size: 10px;
            background: var(--success);
            color: white;
            padding: 2px 7px;
            border-radius: 10px;
        }

        .price-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 13px;
            margin-left: 8px;
            opacity: 0.6;
        }

        .add-price-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            align-items: center;
        }

        .add-price-row select {
            flex: 1.2;
            padding: 9px;
            font-size: 13px;
        }

        .add-price-row input {
            flex: 1;
            padding: 9px;
            font-size: 14px;
        }

        .add-price-btn {
            background: var(--sage);
            color: white;
            border: none;
            border-radius: 8px;
            width: 40px;
            height: 38px;
            font-size: 20px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Histórico */
        .history-item {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .history-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .history-date {
            font-family: 'Georgia', serif;
            font-size: 16px;
            color: var(--charcoal);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-total {
            font-family: -apple-system, sans-serif;
            font-size: 13px;
            color: var(--sage-dark);
            font-weight: 600;
        }

        .history-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .history-details.open { max-height: 1500px; }

        .history-details-inner {
            padding: 0 16px 14px;
            border-top: 1px solid var(--line);
        }

        .history-product {
            padding: 8px 0;
            border-bottom: 1px solid var(--cream);
            font-family: -apple-system, sans-serif;
            font-size: 13px;
            color: var(--charcoal);
            display: flex;
            justify-content: space-between;
        }

        .history-product:last-child { border-bottom: none; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(46,58,52,0.5);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--cream);
            border-radius: 20px 20px 0 0;
            padding: 24px 20px 30px;
            width: 100%;
            max-width: 640px;
            max-height: 88vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal h3 {
            font-family: 'Georgia', serif;
            font-size: 20px;
            color: var(--sage-dark);
            margin-bottom: 18px;
            font-weight: normal;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .modal-actions .btn { margin-top: 0; }
        .btn-cancel { background: var(--line); color: var(--charcoal); }

        input[type="file"] { display: none; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app-header">
        <div class="sync-status" id="sync-status"><span class="sync-dot"></span>Sincronizado</div>
        <h1 class="app-title">Minhas Compras</h1>
        <p class="app-subtitle">organize, compare e economize</p>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="lista" onclick="showTab('lista', event)">
            <span class="tab-icon">🛒</span>Lista
        </button>
        <button class="tab" data-tab="precos" onclick="showTab('precos', event)">
            <span class="tab-icon">🔖</span>Preços
        </button>
        <button class="tab" data-tab="historico" onclick="showTab('historico', event)">
            <span class="tab-icon">📖</span>Histórico
        </button>
    </div>

    <!-- ===== LISTA ===== -->
    <div class="section-view active" id="view-lista">
        <div class="content">
            <div class="add-card">
                <h3>Adicionar à lista</h3>
                <div class="field">
                    <label>Produto</label>
                    <input type="text" id="l-nome" placeholder="Ex.: Extrato de tomate">
                </div>
                <div class="field">
                    <label>Marca</label>
                    <input type="text" id="l-marca" placeholder="Ex.: Mutti (opcional)">
                </div>
                <div class="field-row">
                    <div class="field">
                        <label>Quantidade</label>
                        <input type="number" id="l-qtd" value="1" min="0" inputmode="numeric">
                    </div>
                    <div class="field">
                        <label>Valor unid. (CHF)</label>
                        <input type="number" id="l-valor" placeholder="0.00" min="0" step="0.05" inputmode="decimal">
                    </div>
                </div>
                <div class="field">
                    <label>Onde comprar</label>
                    <select id="l-loja"></select>
                </div>
                <div class="field">
                    <label>Foto do produto</label>
                    <label class="photo-upload" for="l-foto-input">
                        <span class="photo-upload-icon" id="l-foto-icon">📷</span>
                        <span id="l-foto-text">Tocar para tirar foto ou escolher da galeria</span>
                    </label>
                    <input type="file" id="l-foto-input" accept="image/*" onchange="handlePhotoSelect(this,'l')">
                </div>
                <button class="btn btn-primary" onclick="addItem()">Adicionar à lista</button>
            </div>

            <div class="toolbar">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="busca-lista" placeholder="Buscar na lista..." oninput="renderLista()">
                </div>
                <select class="filter-select" id="filtro-loja" onchange="renderLista()">
                    <option value="">Todas as lojas</option>
                </select>
            </div>

            <div class="totals" id="totals-banner">
                <div class="totals-main">
                    <span class="totals-main-label">Total estimado</span>
                    <span class="totals-main-value" id="total-geral">CHF 0.00</span>
                </div>
                <div class="totals-by-store" id="totals-store"></div>
            </div>

            <ul class="item-list" id="lista-items"></ul>

            <button class="btn btn-success hidden" id="finalizar-btn" onclick="finalizarCompra()">
                ✓ Finalizar compra e salvar no histórico
            </button>
        </div>
    </div>

    <!-- ===== PREÇOS ===== -->
    <div class="section-view" id="view-precos">
        <div class="content">
            <div class="add-card">
                <h3>Anotar preço de um produto</h3>
                <div class="field">
                    <label>Produto</label>
                    <input type="text" id="p-nome" placeholder="Ex.: Extrato de tomate">
                </div>
                <div class="field-row">
                    <div class="field">
                        <label>Mercado</label>
                        <select id="p-loja"></select>
                    </div>
                    <div class="field">
                        <label>Preço (CHF)</label>
                        <input type="number" id="p-valor" placeholder="0.00" min="0" step="0.05" inputmode="decimal">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="addPreco()">Anotar preço</button>
            </div>

            <div class="toolbar">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="busca-precos" placeholder="Buscar produto..." oninput="renderPrecos()">
                </div>
            </div>

            <div id="precos-list"></div>
        </div>
    </div>

    <!-- ===== HISTÓRICO ===== -->
    <div class="section-view" id="view-historico">
        <div class="content">
            <div id="historico-list"></div>
        </div>
    </div>

    <!-- Modal gerenciar lojas -->
    <div class="modal-overlay" id="modal-loja">
        <div class="modal">
            <h3>Adicionar novo mercado</h3>
            <div class="field">
                <label>Nome do mercado</label>
                <input type="text" id="nova-loja-nome" placeholder="Ex.: Aldi">
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeModal('modal-loja')">Cancelar</button>
                <button class="btn btn-primary" onclick="salvarNovaLoja()">Adicionar</button>
            </div>
        </div>
    </div>

    <!-- Modal editar item -->
    <div class="modal-overlay" id="modal-edit">
        <div class="modal">
            <h3>Editar produto</h3>
            <div class="field">
                <label>Produto</label>
                <input type="text" id="e-nome">
            </div>
            <div class="field">
                <label>Marca</label>
                <input type="text" id="e-marca">
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Quantidade</label>
                    <input type="number" id="e-qtd" min="0" inputmode="numeric">
                </div>
                <div class="field">
                    <label>Valor unid. (CHF)</label>
                    <input type="number" id="e-valor" min="0" step="0.05" inputmode="decimal">
                </div>
            </div>
            <div class="field">
                <label>Onde comprar</label>
                <select id="e-loja"></select>
            </div>
            <div class="field">
                <label>Foto do produto</label>
                <label class="photo-upload" for="e-foto-input">
                    <img class="photo-upload-preview hidden" id="e-foto-preview">
                    <span class="photo-upload-icon" id="e-foto-icon">📷</span>
                    <span id="e-foto-text">Trocar foto</span>
                </label>
                <input type="file" id="e-foto-input" accept="image/*" onchange="handlePhotoSelect(this,'e')">
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeModal('modal-edit')">Cancelar</button>
                <button class="btn btn-primary" onclick="salvarEdicao()">Salvar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB1mu2Nfcx5d6x--tlyguFZn7UuZC2Mjs",
            authDomain: "lista-compras-ludmilla.firebaseapp.com",
            databaseURL: "https://lista-compras-ludmilla-default-rtdb.firebaseio.com",
            projectId: "lista-compras-ludmilla",
            storageBucket: "lista-compras-ludmilla.firebasestorage.app",
            messagingSenderId: "607047869506",
            appId: "1:607047869506:web:4f40c96b5d9713bbd1f9db"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Estado
        let compras = [];
        let precos = [];
        let historico = [];
        let lojas = ["Coop", "Migros", "Lidl", "E.Leclerc", "Metro"];
        let pendingPhoto = { l: null, e: null };
        let editingId = null;

        // Referências Firebase
        const comprasRef = ref(database, 'compras');
        const precosRef = ref(database, 'precos');
        const historicoRef = ref(database, 'historico');
        const lojasRef = ref(database, 'lojas');

        // ---- Sincronização ----
        onValue(comprasRef, (snap) => {
            const d = snap.val();
            compras = Array.isArray(d) ? d : (d ? Object.values(d) : []);
            renderLista();
        });
        onValue(precosRef, (snap) => {
            const d = snap.val();
            precos = Array.isArray(d) ? d : (d ? Object.values(d) : []);
            renderPrecos();
        });
        onValue(historicoRef, (snap) => {
            const d = snap.val();
            historico = Array.isArray(d) ? d : (d ? Object.values(d) : []);
            renderHistorico();
        });
        onValue(lojasRef, (snap) => {
            const d = snap.val();
            if (d && Array.isArray(d) && d.length) lojas = d;
            refreshLojaSelects();
            renderLista();
            renderPrecos();
        });

        function saveAll() {
            const s = document.getElementById('sync-status');
            s.textContent = ''; 
            s.classList.add('syncing');
            const dot = document.createElement('span'); dot.className='sync-dot';
            s.prepend(dot); s.append('Salvando...');
            Promise.all([
                set(comprasRef, compras),
                set(precosRef, precos),
                set(historicoRef, historico),
                set(lojasRef, lojas)
            ]).then(() => {
                s.classList.remove('syncing');
                s.innerHTML = '<span class="sync-dot"></span>Sincronizado';
            }).catch((e) => {
                s.innerHTML = '<span class="sync-dot"></span>Erro ao salvar';
                console.error(e);
            });
        }
        window.saveAll = saveAll;

        // ---- Utilidades ----
        function fmt(v) { return 'CHF ' + (Number(v)||0).toFixed(2); }

        function refreshLojaSelects() {
            const opts = lojas.map(l => `<option value="${l}">${l}</option>`).join('') +
                         `<option value="__nova__">+ Adicionar mercado...</option>`;
            ['l-loja','e-loja','p-loja'].forEach(id => {
                const el = document.getElementById(id);
                if (el) { const cur = el.value; el.innerHTML = opts; if(cur) el.value = cur; }
            });
            const filtro = document.getElementById('filtro-loja');
            if (filtro) {
                const cur = filtro.value;
                filtro.innerHTML = `<option value="">Todas as lojas</option>` +
                    lojas.map(l => `<option value="${l}">${l}</option>`).join('');
                filtro.value = cur;
            }
        }

        // Detecta escolha de "+ adicionar mercado"
        let lojaSelectTarget = null;
        ['l-loja','e-loja','p-loja'].forEach(id => {
            document.getElementById(id).addEventListener('change', function() {
                if (this.value === '__nova__') {
                    lojaSelectTarget = id;
                    this.value = lojas[0] || '';
                    openModal('modal-loja');
                    setTimeout(()=>document.getElementById('nova-loja-nome').focus(),100);
                }
            });
        });

        window.salvarNovaLoja = function() {
            const nome = document.getElementById('nova-loja-nome').value.trim();
            if (!nome) return;
            if (!lojas.includes(nome)) lojas.push(nome);
            document.getElementById('nova-loja-nome').value = '';
            refreshLojaSelects();
            if (lojaSelectTarget) document.getElementById(lojaSelectTarget).value = nome;
            saveAll();
            closeModal('modal-loja');
        };

        // ---- Fotos ----
        window.handlePhotoSelect = function(input, prefix) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                // Comprime a imagem antes de guardar
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const max = 500;
                    let w = img.width, h = img.height;
                    if (w > h && w > max) { h = h*max/w; w = max; }
                    else if (h > max) { w = w*max/h; h = max; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    pendingPhoto[prefix] = dataUrl;
                    if (prefix === 'l') {
                        document.getElementById('l-foto-icon').outerHTML =
                            `<img class="photo-upload-preview" id="l-foto-icon" src="${dataUrl}">`;
                        document.getElementById('l-foto-text').textContent = 'Foto selecionada ✓';
                    } else {
                        const prev = document.getElementById('e-foto-preview');
                        prev.src = dataUrl; prev.classList.remove('hidden');
                        document.getElementById('e-foto-icon').classList.add('hidden');
                        document.getElementById('e-foto-text').textContent = 'Foto trocada ✓';
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        async function uploadPhoto(dataUrl, id) {
            // Guarda a foto comprimida direto no banco (sem precisar de cartão/Storage)
            return dataUrl || null;
        }

        // ---- LISTA ----
        window.addItem = async function() {
            const nome = document.getElementById('l-nome').value.trim();
            if (!nome) { alert('Escreva o nome do produto'); return; }
            const id = Date.now();
            const item = {
                id,
                nome,
                marca: document.getElementById('l-marca').value.trim(),
                quantidade: parseInt(document.getElementById('l-qtd').value) || 0,
                valor: parseFloat(document.getElementById('l-valor').value) || 0,
                loja: document.getElementById('l-loja').value || (lojas[0]||''),
                foto: null,
                picked: false
            };
            if (pendingPhoto.l) {
                item.foto = await uploadPhoto(pendingPhoto.l, id);
            }
            compras.push(item);
            // limpa formulário
            document.getElementById('l-nome').value = '';
            document.getElementById('l-marca').value = '';
            document.getElementById('l-qtd').value = '1';
            document.getElementById('l-valor').value = '';
            pendingPhoto.l = null;
            document.getElementById('l-foto-icon').outerHTML = `<span class="photo-upload-icon" id="l-foto-icon">📷</span>`;
            document.getElementById('l-foto-text').textContent = 'Tocar para tirar foto ou escolher da galeria';
            saveAll();
        };

        window.adjustQty = function(id, delta) {
            const it = compras.find(i => i.id === id);
            if (it) { it.quantidade = Math.max(0, it.quantidade + delta); saveAll(); }
        };

        window.togglePicked = function(id) {
            const it = compras.find(i => i.id === id);
            if (it) { it.picked = !it.picked; saveAll(); }
        };

        window.deleteItem = function(id) {
            compras = compras.filter(i => i.id !== id);
            renderLista();
            saveAll();
        };

        window.openEdit = function(id) {
            const it = compras.find(i => i.id === id);
            if (!it) return;
            editingId = id;
            document.getElementById('e-nome').value = it.nome;
            document.getElementById('e-marca').value = it.marca || '';
            document.getElementById('e-qtd').value = it.quantidade;
            document.getElementById('e-valor').value = it.valor || '';
            document.getElementById('e-loja').value = it.loja || lojas[0];
            pendingPhoto.e = it.foto || null;
            const prev = document.getElementById('e-foto-preview');
            const icon = document.getElementById('e-foto-icon');
            if (it.foto) {
                prev.src = it.foto; prev.classList.remove('hidden'); icon.classList.add('hidden');
                document.getElementById('e-foto-text').textContent = 'Trocar foto';
            } else {
                prev.classList.add('hidden'); icon.classList.remove('hidden');
                document.getElementById('e-foto-text').textContent = 'Adicionar foto';
            }
            openModal('modal-edit');
        };

        window.salvarEdicao = async function() {
            const it = compras.find(i => i.id === editingId);
            if (!it) return;
            it.nome = document.getElementById('e-nome').value.trim();
            it.marca = document.getElementById('e-marca').value.trim();
            it.quantidade = parseInt(document.getElementById('e-qtd').value) || 0;
            it.valor = parseFloat(document.getElementById('e-valor').value) || 0;
            it.loja = document.getElementById('e-loja').value;
            if (pendingPhoto.e && pendingPhoto.e !== it.foto) {
                it.foto = await uploadPhoto(pendingPhoto.e, it.id);
            }
            closeModal('modal-edit');
            saveAll();
        };

        window.renderLista = function() {
            const busca = (document.getElementById('busca-lista').value||'').toLowerCase();
            const filtroLoja = document.getElementById('filtro-loja').value;
            const list = document.getElementById('lista-items');

            let visiveis = compras.filter(it => {
                const okBusca = !busca || it.nome.toLowerCase().includes(busca) || (it.marca||'').toLowerCase().includes(busca);
                const okLoja = !filtroLoja || it.loja === filtroLoja;
                return okBusca && okLoja;
            });

            // Totais (sempre com base em tudo, respeitando filtro de loja se ativo)
            const base = filtroLoja ? compras.filter(i=>i.loja===filtroLoja) : compras;
            const totalGeral = base.reduce((s,i)=> s + (i.quantidade*i.valor), 0);
            document.getElementById('total-geral').textContent = fmt(totalGeral);

            const porLoja = {};
            compras.forEach(i => { porLoja[i.loja] = (porLoja[i.loja]||0) + i.quantidade*i.valor; });
            document.getElementById('totals-store').innerHTML = Object.keys(porLoja)
                .filter(l => porLoja[l] > 0)
                .map(l => `<div class="store-total">${l}: <span>${fmt(porLoja[l])}</span></div>`).join('') ||
                '<div class="store-total" style="opacity:0.6">Adicione valores para ver os totais</div>';

            // botão finalizar
            const temPicked = compras.some(i => i.picked);
            document.getElementById('finalizar-btn').classList.toggle('hidden', !temPicked);

            if (compras.length === 0) {
                list.innerHTML = `<div class="empty"><div class="empty-icon">🛒</div><p>Sua lista está vazia</p><p class="sub">Adicione produtos acima para começar</p></div>`;
                return;
            }
            if (visiveis.length === 0) {
                list.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>Nenhum produto encontrado</p></div>`;
                return;
            }

            list.innerHTML = visiveis.map(it => {
                const idxReal = compras.indexOf(it);
                const subtotal = it.quantidade * it.valor;
                const fotoHtml = it.foto
                    ? `<img class="item-photo" src="${it.foto}" alt="${it.nome}">`
                    : `<div class="item-photo-empty">🥫</div>`;
                return `
                <li class="item ${it.picked?'picked':''}" draggable="true" data-id="${it.id}" data-idx="${idxReal}">
                    <span class="drag-handle" title="Arraste para reordenar">⠿</span>
                    ${fotoHtml}
                    <div class="item-body">
                        <div class="item-name">${it.nome}</div>
                        ${it.marca ? `<div class="item-brand">${it.marca}</div>` : ''}
                        <div class="item-meta">
                            <span class="store-tag">${it.loja||'—'}</span>
                            <span class="item-price-line">${it.quantidade} × ${fmt(it.valor)} =</span>
                            <span class="item-subtotal">${fmt(subtotal)}</span>
                        </div>
                        <div class="item-controls">
                            <div class="qty-control">
                                <button class="qty-btn" onclick="adjustQty(${it.id},-1)">−</button>
                                <span class="qty-value">${it.quantidade}</span>
                                <button class="qty-btn" onclick="adjustQty(${it.id},1)">+</button>
                            </div>
                            <button class="icon-btn ${it.picked?'btn-uncheck':'btn-check'}" onclick="togglePicked(${it.id})">${it.picked?'↩':'✓'}</button>
                            <button class="icon-btn btn-edit" onclick="openEdit(${it.id})">✎</button>
                            <button class="icon-btn btn-trash" onclick="deleteItem(${it.id})">🗑</button>
                        </div>
                    </div>
                </li>`;
            }).join('');

            attachDragEvents();
        };

        // ---- Drag & drop (reordenar) ----
        let dragSrcIdx = null;

        function attachDragEvents() {
            const items = document.querySelectorAll('#lista-items .item');
            items.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    dragSrcIdx = parseInt(item.dataset.idx);
                    item.classList.add('dragging');
                });
                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging');
                    document.querySelectorAll('.item').forEach(i=>i.classList.remove('drag-over'));
                });
                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    item.classList.add('drag-over');
                });
                item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const destIdx = parseInt(item.dataset.idx);
                    reorder(dragSrcIdx, destIdx);
                });
            });

            // Touch (celular)
            items.forEach(item => {
                const handle = item.querySelector('.drag-handle');
                handle.addEventListener('touchstart', touchStart, {passive:false});
            });
        }

        let touchDragging = null, touchStartY = 0;

        function touchStart(e) {
            e.preventDefault();
            const item = e.target.closest('.item');
            touchDragging = item;
            dragSrcIdx = parseInt(item.dataset.idx);
            item.classList.add('dragging');
            document.addEventListener('touchmove', touchMove, {passive:false});
            document.addEventListener('touchend', touchEnd);
        }

        function touchMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const el = document.elementFromPoint(touch.clientX, touch.clientY);
            const overItem = el ? el.closest('.item') : null;
            document.querySelectorAll('.item').forEach(i=>i.classList.remove('drag-over'));
            if (overItem && overItem !== touchDragging) overItem.classList.add('drag-over');
        }

        function touchEnd(e) {
            const touch = e.changedTouches[0];
            const el = document.elementFromPoint(touch.clientX, touch.clientY);
            const overItem = el ? el.closest('.item') : null;
            if (overItem && overItem !== touchDragging) {
                reorder(dragSrcIdx, parseInt(overItem.dataset.idx));
            }
            if (touchDragging) touchDragging.classList.remove('dragging');
            document.querySelectorAll('.item').forEach(i=>i.classList.remove('drag-over'));
            touchDragging = null;
            document.removeEventListener('touchmove', touchMove);
            document.removeEventListener('touchend', touchEnd);
        }

        function reorder(from, to) {
            if (from === null || to === null || from === to) return;
            const moved = compras.splice(from, 1)[0];
            compras.splice(to, 0, moved);
            renderLista();
            saveAll();
        }

        // ---- Finalizar compra ----
        window.finalizarCompra = function() {
            const pegos = compras.filter(i => i.picked);
            if (pegos.length === 0) { alert('Marque os itens que você comprou (botão ✓)'); return; }
            const total = pegos.reduce((s,i)=> s + i.quantidade*i.valor, 0);
            const registro = {
                id: Date.now(),
                data: new Date().toLocaleDateString('pt-BR'),
                timestamp: new Date().toISOString(),
                total,
                itens: pegos.map(i => ({ nome:i.nome, marca:i.marca, quantidade:i.quantidade, valor:i.valor, loja:i.loja, subtotal:i.quantidade*i.valor }))
            };
            historico.push(registro);
            // remove os itens pegos da lista
            compras = compras.filter(i => !i.picked);
            saveAll();
            alert('Compra finalizada e salva no histórico! Total: ' + fmt(total));
        };

        // ---- PREÇOS ----
        window.addPreco = function() {
            const nome = document.getElementById('p-nome').value.trim();
            const loja = document.getElementById('p-loja').value;
            const valor = parseFloat(document.getElementById('p-valor').value);
            if (!nome) { alert('Escreva o nome do produto'); return; }
            if (!valor || valor <= 0) { alert('Escreva o preço'); return; }

            let prod = precos.find(p => p.nome.toLowerCase() === nome.toLowerCase());
            if (!prod) {
                prod = { id: Date.now(), nome, precos: [] };
                precos.push(prod);
            }
            // atualiza se já existir preço daquela loja, senão adiciona
            const existente = prod.precos.find(x => x.loja === loja);
            if (existente) existente.valor = valor;
            else prod.precos.push({ loja, valor });

            document.getElementById('p-nome').value = '';
            document.getElementById('p-valor').value = '';
            saveAll();
        };

        window.deletePreco = function(prodId, loja) {
            const prod = precos.find(p => p.id === prodId);
            if (!prod) return;
            prod.precos = prod.precos.filter(x => x.loja !== loja);
            if (prod.precos.length === 0) precos = precos.filter(p => p.id !== prodId);
            renderPrecos();
            saveAll();
        };

        window.renderPrecos = function() {
            const busca = (document.getElementById('busca-precos').value||'').toLowerCase();
            const list = document.getElementById('precos-list');
            const visiveis = precos.filter(p => !busca || p.nome.toLowerCase().includes(busca));

            if (precos.length === 0) {
                list.innerHTML = `<div class="empty"><div class="empty-icon">🔖</div><p>Nenhum preço anotado ainda</p><p class="sub">Anote os preços que encontrar em cada mercado para comparar</p></div>`;
                return;
            }
            if (visiveis.length === 0) {
                list.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>Nenhum produto encontrado</p></div>`;
                return;
            }

            list.innerHTML = visiveis.map(prod => {
                const ordenados = [...prod.precos].sort((a,b)=>a.valor-b.valor);
                const menor = ordenados.length ? ordenados[0].valor : null;
                const lojaBarata = ordenados.length ? ordenados[0].loja : '';
                const rows = ordenados.map(pr => `
                    <div class="price-row ${pr.valor===menor?'best':''}">
                        <span class="price-store">${pr.loja} ${pr.valor===menor?'<span class="price-best-badge">melhor preço</span>':''}</span>
                        <span>
                            <span class="price-value">${fmt(pr.valor)}</span>
                            <button class="price-delete" onclick="deletePreco(${prod.id},'${pr.loja.replace(/'/g,"\\'")}')">✕</button>
                        </span>
                    </div>`).join('');
                const opts = lojas.map(l=>`<option value="${l}">${l}</option>`).join('');
                return `
                <div class="compare-product">
                    <div class="compare-header">
                        <div>
                            <div class="compare-name">${prod.nome}</div>
                            ${menor!==null ? `<div class="compare-cheapest">Mais barato: ${lojaBarata} · ${fmt(menor)}</div>` : ''}
                        </div>
                    </div>
                    <div class="compare-prices">
                        ${rows}
                        <div class="add-price-row">
                            <select id="ap-loja-${prod.id}">${opts}</select>
                            <input type="number" id="ap-valor-${prod.id}" placeholder="CHF" step="0.05" min="0" inputmode="decimal">
                            <button class="add-price-btn" onclick="addPrecoRapido(${prod.id})">+</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        };

        window.addPrecoRapido = function(prodId) {
            const prod = precos.find(p => p.id === prodId);
            if (!prod) return;
            const loja = document.getElementById('ap-loja-'+prodId).value;
            const valor = parseFloat(document.getElementById('ap-valor-'+prodId).value);
            if (!valor || valor<=0) { alert('Escreva o preço'); return; }
            const ex = prod.precos.find(x=>x.loja===loja);
            if (ex) ex.valor = valor; else prod.precos.push({loja, valor});
            saveAll();
        };

        // ---- HISTÓRICO ----
        window.toggleHistorico = function(id) {
            const el = document.getElementById('hist-'+id);
            if (el) el.classList.toggle('open');
        };

        window.deleteHistorico = function(id) {
            if (!confirm('Excluir este registro de compra?')) return;
            historico = historico.filter(h => h.id !== id);
            renderHistorico();
            saveAll();
        };

        window.renderHistorico = function() {
            const list = document.getElementById('historico-list');
            if (historico.length === 0) {
                list.innerHTML = `<div class="empty"><div class="empty-icon">📖</div><p>Nenhuma compra finalizada ainda</p><p class="sub">Quando você finalizar uma compra na Lista, ela aparecerá aqui</p></div>`;
                return;
            }
            const ordenado = [...historico].sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp));
            list.innerHTML = ordenado.map(h => `
                <div class="history-item">
                    <div class="history-header" onclick="toggleHistorico(${h.id})">
                        <div class="history-date">📁 ${h.data}</div>
                        <div class="history-total">${fmt(h.total)} ›</div>
                    </div>
                    <div class="history-details" id="hist-${h.id}">
                        <div class="history-details-inner">
                            ${h.itens.map(it => `
                                <div class="history-product">
                                    <span>${it.nome}${it.marca?' · '+it.marca:''} ${it.loja?'('+it.loja+')':''}</span>
                                    <span>${it.quantidade} × ${fmt(it.valor)} = <strong>${fmt(it.subtotal)}</strong></span>
                                </div>`).join('')}
                            <div style="text-align:right;padding-top:10px;font-family:Georgia,serif;color:var(--sage-dark);">
                                Total: <strong>${fmt(h.total)}</strong>
                            </div>
                            <button class="btn btn-cancel" style="margin-top:12px;" onclick="deleteHistorico(${h.id})">Excluir registro</button>
                        </div>
                    </div>
                </div>`).join('');
        };

        // ---- Navegação ----
        window.showTab = function(tab, ev) {
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
            document.querySelectorAll('.section-view').forEach(v=>v.classList.remove('active'));
            (ev? ev.currentTarget : document.querySelector(`[data-tab="${tab}"]`)).classList.add('active');
            document.getElementById('view-'+tab).classList.add('active');
        };

        window.openModal = function(id){ document.getElementById(id).classList.add('open'); };
        window.closeModal = function(id){ document.getElementById(id).classList.remove('open'); };

        // Fecha modal ao tocar fora
        document.querySelectorAll('.modal-overlay').forEach(m => {
            m.addEventListener('click', (e)=>{ if(e.target===m) m.classList.remove('open'); });
        });

        // Init
        refreshLojaSelects();
        renderLista();
        renderPrecos();
        renderHistorico();
    </script>
</body>
</html>
